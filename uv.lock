[[package]]
name = "sagecraft"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "httpx" },
    { name = "mss" },
    { name = "pillow" },
    { name = "python-dotenv" },
    { name = "pyyaml" },
]

[package.optional-dependencies]
dev = [
    { name = "pytest" },
]
macos = [
    { name = "pyobjc-framework-applicationservices", marker = "sys_platform == 'darwin'" },
    { name = "pyobjc-framework-cocoa", marker = "sys_platform == 'darwin'" },
    { name = "pyobjc-framework-quartz", marker = "sys_platform == 'darwin'" },
    { name = "pyobjc-framework-vision", marker = "sys_platform == 'darwin'" },
]
spectator = [
    { name = "pyobjc-framework-webkit", marker = "sys_platform == 'darwin'" },
]

[package.metadata]
requires-dist = [
    { name = "httpx", specifier = ">=0.27,<1" },
    { name = "mss", specifier = ">=10.0,<11" },
    { name = "pillow", specifier = ">=11.0,<13" },
    { name = "pyobjc-framework-applicationservices", marker = "sys_platform == 'darwin' and extra == 'macos'", specifier = ">=10.3" },
    { name = "pyobjc-framework-cocoa", marker = "sys_platform == 'darwin' and extra == 'macos'", specifier = ">=10.3" },
    { name = "pyobjc-framework-quartz", marker = "sys_platform == 'darwin' and extra == 'macos'", specifier = ">=10.3" },
    { name = "pyobjc-framework-vision", marker = "sys_platform == 'darwin' and extra == 'macos'", specifier = ">=10.3" },
    { name = "pyobjc-framework-webkit", marker = "sys_platform == 'darwin' and extra == 'spectator'", specifier = ">=12.2.2,<13" },
    { name = "pytest", marker = "extra == 'dev'", specifier = ">=8.3,<9" },
    { name = "python-dotenv", specifier = ">=1.0,<2" },
    { name = "pyyaml", specifier = ">=6.0,<7" },
]
provides-extras = ["macos", "dev", "spectator"]


[project]
name = "sagecraft"
version = "0.1.0"
license = "Apache-2.0"
description = "Open-source harness that lets Sage, Levanto's decision model, play World of Warcraft from the screen"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mss>=10.0,<11",
    "httpx>=0.27,<1",
    "Pillow>=11.0,<13",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
macos = [
    "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Vision>=10.3; sys_platform == 'darwin'",
]
dev = ["pytest>=8.3,<9", "pytest-xdist>=3.6,<4"]
spectator = ["pyobjc-framework-WebKit>=12.2.2,<13; sys_platform == 'darwin'"]

[project.scripts]
sage-wow = "sage_wow.app:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sage_wow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

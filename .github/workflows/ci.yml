name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      SAGE_WOW_DISABLE_LIVE_INPUT: "1"
      SAGE_WOW_DISABLE_LIVE_CAPTURE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra dev --locked
      - run: uv run pytest -q -n auto
      - run: uv run sage-wow --data-dir data/demo replay examples/final-run-excerpt.jsonl

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check src tests --select F --ignore F841
